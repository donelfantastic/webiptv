<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donelfantastic Official</title>
  <meta http-equiv="cache-control" content="max-age=0">
  <meta http-equiv="cache-control" content="no-cache">
  <meta http-equiv="expires" content="0">
  <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT">
  <meta http-equiv="pragma" content="no-cache">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <meta name="author" content="Donelfantastic">
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/gh/donelfantastic/donelfantastic.github.io@refs/heads/main/src/library/normalize.min.css" />
  <link rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/video.js@8.23.4/dist/video-js.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/videojs-contrib-quality-menu@1.0.4/dist/videojs-contrib-quality-menu.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="./src/latest/style.min.css" />
  <script type="text/javascript">
    $ = jQuery.noConflict();
  </script>
</head>
<body style="background-color: #1a1717;" oncontextmenu="return false;">
  <div class="container"></div>
  <div class="toggle-nav"></div>
  <p class="hint">DONELFANTASTIC</p>
  <nav class="nav">
    <a href="/" class="nav__item">
      <img src="../assets/photo/donel_1.png" class="nav__image">
      <span class="nav__title" data-title="home">Home</span>
      <span class="nav__subtitle">Donelfantastic</span>
    </a>
  </nav>
  <h5 class="df_title">WEB<span>IPTV</span></h5>
  <div class="container-fluid"></div>
  <section class="content-area">
    <div class="mb-3"><label for="m3uLink" class="form-label"></label>
      <div class="input-group"><input type="text" class="form-control" id="m3uLink" placeholder="https://example.com/playlist.m3u (.m3u8 or .txt)"><button id="loadButton" class="btn btn-primary">LOAD</button></div><input type="file" id="uploadFile" accept=".m3u,.m3u8,.txt" class="form-control mt-3">
      <div class="mt-3"><select id="categorySelect" class="form-select"></select></div>
      <div class="channel-toolbar mt-3">
        <strong>Channels</strong>
        <div class="view-buttons">
          <button type="button" id="gridViewButton" class="btn btn-primary btn-sm">
            Grid
          </button>
          <button type="button" id="listViewButton" class="btn btn-outline-light btn-sm">
            List
          </button>
        </div>
      </div>
      <div id="channelGrid" class="channel-grid grid-view"></div>
      <div id="playerPanel" class="player-panel">
        <div class="player-header">
          <button type="button" id="backButton" class="btn btn-outline-light">
            ←
          </button>
          <span id="nowPlaying" class="now-playing"></span>
        </div>
        <div class="video-section video-responsive" id="videoSection">
          <video id="player" class="video-js" autoplay muted controls playsinline crossorigin>
          </video>
        </div>
      </div>
  </section>
  <!-- SOCIAL PANEL HTML -->
  <div class="social-panel-container">
    <div class="social-panel">
      <p>Donelfantastic<i class="fa fa-copyright"></i>2023 -
        <a target="_blank" href="https://donelfantastic.github.io">2029</a>
      </p>
      <button class="close-btn"><i class="fas fa-times"></i></button>
      <h4>follow us on</h4>
      <ul>
        <li>
          <a href="https://www.tiktok.com/@donelfantastic" target="_blank">
            <i class="fab fa-tiktok"></i>
          </a>
        </li>
        <li>
          <a href="https://x.com/Donelfantastic" target="_blank">
            <i class="fab fa-x-twitter"></i>
          </a>
        </li>
        <li>
          <a href="https://youtube.com/@donelfantastic" target="_blank">
            <i class="fab fa-youtube"></i>
          </a>
        </li>
        <li>
          <a href="https://facebook.com/donelfantastic" target="_blank">
            <i class="fab fa-facebook"></i>
          </a>
        </li>
        <li>
          <a href="https://instagram.com/donelfantastic" target="_blank">
            <i class="fab fa-instagram"></i>
          </a>
        </li>
      </ul>
    </div>
  </div>
  <button class="floating-btn">
    Get in Touch
  </button>
  <script type="text/javascript" src="//cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script type="text/javascript" src="//cdn.jsdelivr.net/npm/video.js@8.23.4/dist/video.min.js"></script>
  <script type="text/javascript" src="//cdn.jsdelivr.net/npm/mpegts.js@latest/dist/mpegts.min.js"></script>
  <script type="text/javascript" src="//cdn.jsdelivr.net/npm/videojs-mpegts@0.2.0/dist/videojs-mpegts.min.js"></script>
  <script type="text/javascript" src="//cdn.jsdelivr.net/npm/videojs-contrib-quality-menu@1.0.4/dist/videojs-contrib-quality-menu.min.js"></script>
  <script type="text/javascript" src="//cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
  <script src="./src/latest/script.min.js"></script>
</body>
</html>
